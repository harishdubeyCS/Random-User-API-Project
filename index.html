<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User API Project</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>

    <h1>Random User</h1>

    <div class="container">
        <p id="errorMessage"></p>
        <div class="upper-section">
            <div class="image-box">
                <div class="image-circle">
                    <img id="userImage">
                </div>
            </div>
            <div class="content">
                <h3 id="name"></h3>
                <h4 id="email"></h4>
                <span id="phone"></span>
                <p id="location"></p>
            </div>
        </div>
        <button id="generateBtn">Generate Random User</button>
    </div>

    <script src="script/js.js"></script>
</body>

</html>
